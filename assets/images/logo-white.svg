<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 120" width="100%" height="100%">
  <defs>
    <linearGradient id="whiteOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA84D" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="whiteDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6EFF6" />
    </linearGradient>
    <linearGradient id="whiteBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DFE7EE" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM -->
  <g id="emblem-group-white" transform="translate(10, 3)">
    <!-- White Roof / Outer Structure 'T' -->
    <path d="M 52 5 L 85 24 L 75 39 L 52 25 L 34 36 L 34 68 L 22 75 L 22 30 Z" fill="url(#whiteDarkGrad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.25))" />
    <!-- Left White Base Pillar -->
    <path d="M 22 75 L 34 68 L 34 100 L 22 93 Z" fill="url(#whiteDarkGrad)" />
    
    <!-- Orange Hex Structure 'E' Frame -->
    <path d="M 52 5 L 98 32 L 98 88 L 68 105 L 56 98 L 86 81 L 86 39 L 52 19 Z" fill="url(#whiteOrangeGrad)" />
    <path d="M 48 48 L 78 48 L 78 60 L 48 60 Z" fill="url(#whiteOrangeGrad)" />
    <path d="M 48 93 L 68 105 L 52 115 L 34 105 L 34 93 L 48 93 Z" fill="url(#whiteOrangeGrad)" />

    <!-- Center Bolt Graphic -->
    <rect x="44" y="66" width="22" height="6" rx="1.5" fill="#FFA566" />
    <rect x="47" y="73" width="16" height="28" rx="1" fill="url(#whiteBoltGrad)" />
    <!-- Thread ridges in dark navy for contrast -->
    <path d="M 47 79 L 63 76 M 47 85 L 63 82 M 47 91 L 63 88 M 47 97 L 63 94" stroke="#0B1926" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- VERTICAL ORANGE SEPARATOR -->
  <rect x="132" y="16" width="3.5" height="88" rx="1.75" fill="#FFA84D" />

  <!-- TITAN WORDMARK (WHITE) -->
  <g id="wordmark-white" transform="translate(150, 16)">
    <!-- TITAN TEXT IN CRISP WHITE -->
    <path d="M 0 6 L 38 6 L 38 18 L 25 18 L 25 58 L 13 58 L 13 18 L 0 18 Z" fill="#FFFFFF" />
    <path d="M 46 6 L 58 6 L 58 58 L 46 58 Z" fill="#FFFFFF" />
    <path d="M 66 6 L 104 6 L 104 18 L 91 18 L 91 58 L 79 58 L 79 18 L 66 18 Z" fill="#FFFFFF" />
    <path d="M 125 6 L 143 58 L 130 58 L 125 43 L 111 43 L 106 58 L 94 58 L 112 6 Z M 118 22 L 113 36 L 123 36 Z" fill="#FFFFFF" />
    <!-- Orange Triangle within A -->
    <polygon points="118,22 113,36 123,36" fill="#FFA84D" />
    <polygon points="118,36 109,58 127,58" fill="#FFA84D" />
    <path d="M 148 6 L 160 6 L 180 43 L 180 6 L 192 6 L 192 58 L 180 58 L 160 21 L 160 58 L 148 58 Z" fill="#FFFFFF" />

    <!-- FASTENERS & SUPPLY SUB-TEXT IN VIBRANT ORANGE -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#FFA566" letter-spacing="2" textLength="192" lengthAdjust="spacingAndGlyphs">FASTENERS &amp; SUPPLY</text>
  </g>
</svg>
