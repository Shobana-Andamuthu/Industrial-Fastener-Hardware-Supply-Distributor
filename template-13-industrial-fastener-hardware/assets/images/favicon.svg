<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="favOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#E47B32" />
    </linearGradient>
    <linearGradient id="favDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24384B" />
      <stop offset="100%" stop-color="#14212D" />
    </linearGradient>
    <linearGradient id="favBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5C6D" />
      <stop offset="100%" stop-color="#1E2A36" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(10, 5)">
